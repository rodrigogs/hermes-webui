<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes One — Provider Quotas & Insights</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #a371f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); padding: 24px;
    max-width: 1100px; margin: 0 auto;
  }
  h1 { font-size: 1.5rem; margin-bottom: 8px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 0.9rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .stat .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
  .stat .value { font-size: 1.3rem; font-weight: 600; }
  .section-title { font-size: 1.1rem; margin: 24px 0 12px; color: var(--accent); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
  th { background: #1c2128; color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: 0.7rem; }
  td { color: var(--text); }
  .bar-wrap { display: flex; align-items: center; gap: 8px; }
  .bar { height: 8px; border-radius: 4px; min-width: 4px; background: var(--accent); }
  .bar-bg { flex: 1; background: #21262d; border-radius: 4px; overflow: hidden; }
  .pct { color: var(--muted); font-size: 0.8rem; min-width: 40px; }
  .loading { text-align: center; color: var(--muted); padding: 48px; }
  .error { color: var(--red); text-align: center; padding: 24px; }
  .refresh { display: inline-block; margin-bottom: 16px; color: var(--accent); cursor: pointer; font-size: 0.8rem; user-select: none; }
  .refresh:hover { text-decoration: underline; }
  .cost { color: var(--green); font-family: monospace; }
</style>
</head>
<body>

<h1>📊 Provider Quotas & Insights</h1>
<div class="subtitle">Hermes One — <span id="period">Last 30 days</span> · <span class="refresh" onclick="load()">↻ Refresh</span></div>

<div id="content"><div class="loading">Loading insights…</div></div>

<script>
async function load() {
  try {
    const res = await fetch('/api/insights?days=30');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    if (d.error) throw new Error(d.detail || d.error);
    render(d);
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="error">⚠ ' + e.message + '</div>';
  }
}

function fmt(n) {
  if (n === undefined || n === null) return '—';
  if (n >= 1e9) return (n/1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return '' + n;
}

function render(d) {
  const cost = d.total_cost ? '$' + d.total_cost.toFixed(2) : '—';

  let models = Object.entries(d.model_stats || {}).sort((a,b) => b[1].input_tokens - a[1].input_tokens);
  const maxTokens = models.length ? Math.max(...models.map(m => m[1].input_tokens)) : 1;

  let html = `
    <div class="grid">
      <div class="stat"><div class="label">Sessions</div><div class="value">${d.total_sessions || 0}</div></div>
      <div class="stat"><div class="label">Messages</div><div class="value">${fmt(d.total_messages)}</div></div>
      <div class="stat"><div class="label">Tool Calls</div><div class="value">${fmt(d.tool_calls)}</div></div>
      <div class="stat"><div class="label">Input Tokens</div><div class="value" style="color:var(--accent)">${fmt(d.total_input_tokens)}</div></div>
      <div class="stat"><div class="label">Output Tokens</div><div class="value" style="color:var(--purple)">${fmt(d.total_output_tokens)}</div></div>
      <div class="stat"><div class="label">Est. Cost</div><div class="value cost">${cost}</div></div>
    </div>`;

  html += '<div class="section-title">🔧 By Model</div><table>';
  html += '<tr><th>Model</th><th>Sessions</th><th>Tokens</th><th style="width:30%">Share</th><th>Cost</th></tr>';

  for (const [name, m] of models) {
    const tokens = (m.input_tokens||0) + (m.output_tokens||0);
    const pct = maxTokens ? ((m.input_tokens||0) / maxTokens * 100).toFixed(1) : '0';
    const c = m.cost ? '$' + m.cost.toFixed(2) : '—';
    html += `<tr>
      <td>${name}</td>
      <td>${m.sessions||0}</td>
      <td>${fmt(tokens)}</td>
      <td><div class="bar-wrap"><div class="bar-bg"><div class="bar" style="width:${pct}%"></div></div><span class="pct">${pct}%</span></div></td>
      <td class="cost">${c}</td>
    </tr>`;
  }
  html += '</table>';

  document.getElementById('content').innerHTML = html;
}

load();
</script>
</body>
</html>
